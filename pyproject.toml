[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "volve-mlready"
version = "1.0.0"
description = "Loader and examples for the Volve ML-ready seismic-well dataset"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT (code); data under the Equinor Open Data Licence" }
dependencies = ["numpy>=1.24", "pandas>=2.2"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.6", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]
